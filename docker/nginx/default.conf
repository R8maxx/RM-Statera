server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Las evidencias admiten 50 MB (GuardarEvidenciaRequest). Este límite, el de
    # `upload_max_filesize` y el de `post_max_size` van juntos: el más bajo de
    # los tres es el que manda, y nginx falla con un 413 que no dice de dónde
    # sale el número.
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # La generación documental síncrona (`documentos:generar --sync`) puede
        # tardar: la cadena de tiempos que describe CLAUDE.md llega hasta 300 s
        # en el job, y aquí se cortaría a los 60 por defecto.
        fastcgi_read_timeout 300;
    }

    # En desarrollo los assets los sirve Vite en el 5173; aquí no se cachea nada
    # para que `public/hot` y `public/build` se lean siempre frescos.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
