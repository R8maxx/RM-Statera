; Ajustes de la aplicación. Se monta como conf.d, así que sólo hace falta
; declarar lo que se aparta del php.ini-production de la imagen.

memory_limit = 512M

; Las evidencias validan `max:51200` KB — 50 MB — en GuardarEvidenciaRequest.
; El límite de PHP tiene que quedar por encima, y el de nginx también
; (`client_max_body_size` en docker/nginx/default.conf): si uno de los tres se
; queda corto, la subida falla con un error que no menciona el tamaño.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Entorno de desarrollo: opcache encendido, pero revalidando en cada petición.
; Sin `validate_timestamps=1` habría que reiniciar php-fpm después de cada
; edición, que es exactamente el ciclo que este montaje viene a evitar.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

; Las fechas del dominio tienen consecuencias legales; que el CLI y la web
; coincidan con APP_TIMEZONE evita sorpresas al comparar registros.
date.timezone = Europe/Madrid

; El worker de la cola y la generación documental son lo lento del producto.
; El techo de Gotenberg lo pone el job (300 s), no PHP.
max_execution_time = 120
