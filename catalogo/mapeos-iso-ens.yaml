# Mapeos ISO/IEC 27001:2022 ↔ ENS (RD 311/2022)
#
# Esta es la pieza que justifica el proyecto: sin ella, una evidencia que sirve a
# un control ISO y a tres medidas ENS se mantiene por triplicado, que es
# exactamente el problema que hoy se sufre en hojas de cálculo.
#
# `tipo` no es decorativo:
#   - equivalente: el destino cubre el origen en lo sustancial.
#   - parcial:     cubre una parte; la nota dice cuál y qué queda fuera.
#   - relacionado: se apoyan mutuamente, pero ninguno cubre al otro.
#
# Dar por equivalente una correspondencia parcial es la forma más rápida de
# declarar implantado algo que no lo está, así que en la duda va `parcial` con
# nota.
#
# Cobertura: este fichero recoge las correspondencias principales, no todas las
# posibles. Se amplía a medida que se trabaja cada control. `revisado: false`
# hasta contrastarlo con el Anexo II del BOE y con la guía CCN-STIC 825.
fuente: 'Elaboración propia a partir de ISO/IEC 27001:2022 Anexo A y RD 311/2022 Anexo II'
revisado: false

mapeos:
  # --- Marco organizativo -----------------------------------------------------
  - origen: {marco: ISO27001-2022, codigo: A.5.1}
    destino: {marco: ENS-RD311-2022, codigo: org.1}
    tipo: equivalente
    nota: Ambos exigen una política de seguridad aprobada por la dirección, publicada y revisada.

  - origen: {marco: ISO27001-2022, codigo: A.5.1}
    destino: {marco: ENS-RD311-2022, codigo: org.2}
    tipo: parcial
    nota: La normativa de seguridad del ENS es el segundo nivel documental; la ISO lo trata dentro del mismo control de políticas.

  - origen: {marco: ISO27001-2022, codigo: A.5.37}
    destino: {marco: ENS-RD311-2022, codigo: org.3}
    tipo: equivalente
    nota: Procedimientos operativos documentados.

  - origen: {marco: ISO27001-2022, codigo: A.5.2}
    destino: {marco: ENS-RD311-2022, codigo: org.1}
    tipo: parcial
    nota: >-
      El ENS exige roles nominados y con separación obligatoria (responsable de
      la información, del servicio, de seguridad y del sistema). La ISO exige
      asignar responsabilidades pero no impone esa estructura.

  - origen: {marco: ISO27001-2022, codigo: A.5.3}
    destino: {marco: ENS-RD311-2022, codigo: op.acc.3}
    tipo: equivalente
    nota: Segregación de funciones y tareas.

  - origen: {marco: ISO27001-2022, codigo: A.5.8}
    destino: {marco: ENS-RD311-2022, codigo: org.4}
    tipo: parcial
    nota: >-
      El proceso de autorización del ENS es más amplio que la gestión de
      proyectos: cubre la entrada en servicio de instalaciones, equipos,
      aplicaciones y soportes.

