# Esquema Nacional de Seguridad — Real Decreto 311/2022, de 3 de mayo
#
# Anexo II completo: los tres marcos (organizativo, operacional y medidas de
# protección) con la matriz de aplicabilidad por categoría.
#
# Se carga el Anexo II ENTERO aunque de momento solo se use el subconjunto de
# categoría básica (invariante 5 de la especificación): el coste marginal es un
# seed más largo, y el coste de cargarlo a medias es rehacer el modelo cuando
# llegue el primer cliente de categoría media.
#
# ---------------------------------------------------------------------------
# PENDIENTE DE VERIFICACIÓN
#
# Los códigos, títulos y, sobre todo, la matriz de aplicabilidad de este fichero
# están escritos a partir del RD 311/2022 y deben contrastarse CELDA A CELDA con
# el texto publicado en el BOE (BOE-A-2022-7191) antes de dar el catálogo por
# bueno. Hasta entonces, `revisado: false`.
#
# La corrección es barata: se corrige el YAML y se reimporta. El importador hace
# diff y dice exactamente qué cambia.
#
# Falta también, y se añadirá en la misma pasada de verificación:
#   - La descripción literal de cada refuerzo R1/R2/R3 del Anexo II. La matriz ya
#     registra QUÉ refuerzo se exige, que es lo que el motor de categorización
#     necesita; falta el texto que lo describe.
#   - Los perfiles de cumplimiento específicos de la serie CCN-STIC 890, incluido
#     el de requisitos esenciales.
# ---------------------------------------------------------------------------
#
# Lectura de `aplicabilidad`: la clave es la categoría del sistema. Cuando la
# celda lleva `dimension`, el valor se lee como el NIVEL de esa dimensión
# concreta (bajo/medio/alto) en lugar de como la categoría global: es la
# modulación por dimensión que aplican algunas medidas del marco operacional.
marco:
  codigo: ENS-RD311-2022
  nombre: Esquema Nacional de Seguridad
  version: RD 311/2022
  fecha_vigencia: '2022-05-05'
  estado: vigente

fuente: 'BOE-A-2022-7191, Real Decreto 311/2022 de 3 de mayo, Anexo II'
revisado: false

requisitos:
  # ===========================================================================
  # MARCO ORGANIZATIVO
  # ===========================================================================
  - codigo: org
    tipo: medida
    titulo: Marco organizativo
    orden: 100
    hijos:
      - codigo: org.1
        tipo: medida
        titulo: Política de seguridad
        aplicabilidad: {basica: aplica, media: aplica, alta: aplica}
      - codigo: org.2
        tipo: medida
        titulo: Normativa de seguridad
        aplicabilidad: {basica: aplica, media: aplica, alta: aplica}
      - codigo: org.3
        tipo: medida
        titulo: Procedimientos de seguridad
        aplicabilidad: {basica: aplica, media: aplica, alta: aplica}
      - codigo: org.4
        tipo: medida
        titulo: Proceso de autorización
        aplicabilidad: {basica: aplica, media: aplica, alta: aplica}

