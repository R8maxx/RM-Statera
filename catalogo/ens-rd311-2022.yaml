      - codigo: op.acc
        tipo: medida
        titulo: Control de acceso
        hijos:
          # El Anexo II la modula por T A, y el modelo sólo admite UNA
          # dimensión por celda. Se deja leer por categoría, que es el máximo de las
          # cinco: nunca exige de menos, y exige de más sólo si la dimensión más alta
          # es una de las que el Anexo II deja fuera.
          - codigo: op.acc.1
            tipo: medida
            titulo: Identificación
            aplicabilidad: {basica: aplica, media: R1, alta: R1}
          # El Anexo II la modula por C I T A, y el modelo sólo admite UNA
          # dimensión por celda. Se deja leer por categoría, que es el máximo de las
          # cinco: nunca exige de menos, y exige de más sólo si la dimensión más alta
          # es una de las que el Anexo II deja fuera.
          - codigo: op.acc.2
            tipo: medida
            titulo: Requisitos de acceso
            aplicabilidad: {basica: aplica, media: aplica, alta: R1}
          # El Anexo II la modula por C I T A, y el modelo sólo admite UNA
          # dimensión por celda. Se deja leer por categoría, que es el máximo de las
          # cinco: nunca exige de menos, y exige de más sólo si la dimensión más alta
          # es una de las que el Anexo II deja fuera.
          - codigo: op.acc.3
            tipo: medida
            titulo: Segregación de funciones y tareas
            aplicabilidad: {basica: no_aplica, media: aplica, alta: R1}
          # El Anexo II la modula por C I T A, y el modelo sólo admite UNA
          # dimensión por celda. Se deja leer por categoría, que es el máximo de las
          # cinco: nunca exige de menos, y exige de más sólo si la dimensión más alta
          # es una de las que el Anexo II deja fuera.
          - codigo: op.acc.4
            tipo: medida
            titulo: Proceso de gestión de derechos de acceso
            aplicabilidad: {basica: aplica, media: aplica, alta: aplica}
          # El Anexo II la modula por C I T A, y el modelo sólo admite UNA
          # dimensión por celda. Se deja leer por categoría, que es el máximo de las
          # cinco: nunca exige de menos, y exige de más sólo si la dimensión más alta
          # es una de las que el Anexo II deja fuera.
          # basica: el Anexo II dice «+ [R1 o R2 o R3 o R4]». El grupo [R1 o R2 o R3 o R4] es una alternativa
          # —uno a elegir— y el modelo no sabe guardarla; queda lo que se exige seguro.
          # media: el Anexo II dice «+ [R2 o R3 o R4] + R5». El grupo [R2 o R3 o R4] es una alternativa
          # —uno a elegir— y el modelo no sabe guardarla; queda lo que se exige seguro.
          # alta: el Anexo II dice «+ [R2 o R3 o R4] + R5». El grupo [R2 o R3 o R4] es una alternativa
          # —uno a elegir— y el modelo no sabe guardarla; queda lo que se exige seguro.
          - codigo: op.acc.5
            tipo: medida
            titulo: Mecanismo de autenticación (usuarios externos)
            aplicabilidad: {basica: aplica, media: R5, alta: R5}
          # El Anexo II la modula por C I T A, y el modelo sólo admite UNA
          # dimensión por celda. Se deja leer por categoría, que es el máximo de las
          # cinco: nunca exige de menos, y exige de más sólo si la dimensión más alta
          # es una de las que el Anexo II deja fuera.
          # basica: el Anexo II dice «+ [R1 o R2 o R3 o R4] + R8 + R9». El grupo [R1 o R2 o R3 o R4] es una alternativa
          # —uno a elegir— y el modelo no sabe guardarla; queda lo que se exige seguro.
          # media: el Anexo II dice «+ [R1 o R2 o R3 o R4] + R5 + R8 + R9». El grupo [R1 o R2 o R3 o R4] es una alternativa
          # —uno a elegir— y el modelo no sabe guardarla; queda lo que se exige seguro.
          # alta: el Anexo II dice «+ [R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9». El grupo [R1 o R2 o R3 o R4] es una alternativa
          # —uno a elegir— y el modelo no sabe guardarla; queda lo que se exige seguro.
          - codigo: op.acc.6
            tipo: medida
            titulo: Mecanismo de autenticación (usuarios de la organización)
            aplicabilidad: {basica: R9, media: R9, alta: R9}

