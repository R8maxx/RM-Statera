            aplicabilidad: {basica: aplica, media: aplica, alta: aplica}
          - codigo: op.acc.5
            tipo: medida
            titulo: Mecanismo de autenticación (usuarios externos)
            aplicabilidad: {basica: aplica, media: R1, alta: R2}
            refuerzos:
              - codigo: R1
                descripcion: >-
                  Se exige un segundo factor de autenticación además de la
                  contraseña.
              - codigo: R2
                descripcion: >-
                  Se exige autenticación basada en certificado cualificado o
                  equivalente, sobre dispositivo cualificado de creación de firma.
          - codigo: op.acc.6
            tipo: medida
            titulo: Mecanismo de autenticación (usuarios de la organización)
            aplicabilidad: {basica: aplica, media: R1, alta: R2}
            refuerzos:
