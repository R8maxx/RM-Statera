# Esquema Nacional de Seguridad — Real Decreto 311/2022, de 3 de mayo
#
# Anexo II completo: los tres marcos (organizativo, operacional y medidas de
# protección) con la matriz de aplicabilidad por categoría.
#
# Se carga el Anexo II ENTERO aunque de momento solo se use el subconjunto de
# categoría básica (invariante 5 de la especificación): el coste marginal es un
# seed más largo, y el coste de cargarlo a medias es rehacer el modelo cuando
# llegue el primer cliente de categoría media.
#
# ---------------------------------------------------------------------------
# CONTRASTADO CON EL BOE, Y LO QUE FALTA
#
# Códigos, títulos y matriz se han contrastado celda a celda contra el texto
# consolidado de BOE-A-2022-7191 (Anexo II, tabla de medidas de seguridad). De
# ahí salieron 73 celdas mal —muchas de ellas exigiendo de MENOS en categoría
# básica—, cinco títulos con la redacción cambiada y una medida de sobra,
# `op.exp.11`, que es numeración del RD 3/2010 y no existe en el RD 311/2022.
# Todo eso está corregido en este fichero.
#
# `revisado` sigue en `false` porque quedan dos cosas que NO son datos, sino
# modelo, y no se pueden arreglar aquí:
#
#   1. Nueve medidas están moduladas por VARIAS dimensiones a la vez (`op.acc.1`
#      por T y A; `op.acc.2` a `op.acc.6` por C, I, T y A; `mp.com.3` y
#      `mp.info.3` por I y A; `mp.si.2` por C e I). La tabla `aplicabilidad_ens`
#      guarda una sola `dimension_moduladora`. Mientras tanto se leen por
#      categoría —el máximo de las cinco—, que exige de más pero nunca de menos.
#      Cada una lleva su aviso justo encima.
#
#   2. Diez celdas de cuatro medidas (`op.acc.5`, `op.acc.6`, `mp.com.4` y
#      `mp.s.2`) exigen un refuerzo A ELEGIR entre varios: «+ [R1 o R2]». El
#      value object `Exigencia` guarda un único `Rn` y no sabe expresar una
#      alternativa. Queda registrado lo que se exige con seguridad, y el aviso
#      de encima lleva la celda literal del BOE.
#
# Y sigue faltando, como antes:
#   - La descripción literal de cada refuerzo R1/R2/R3 del Anexo II. La matriz ya
#     registra QUÉ refuerzo se exige, que es lo que el motor de categorización
#     necesita; falta el texto que lo describe.
#   - Los perfiles de cumplimiento específicos de la serie CCN-STIC 890, incluido
#     el de requisitos esenciales.
# ---------------------------------------------------------------------------
#
# Lectura de `aplicabilidad`: la clave es la categoría del sistema. Cuando la
# celda lleva `dimension`, el valor se lee como el NIVEL de esa dimensión
# concreta (bajo/medio/alto) en lugar de como la categoría global: es la
# modulación por dimensión que aplican algunas medidas del marco operacional.
#
# Y sobre los refuerzos: en el Anexo II se acumulan —«+ R1 + R2» significa que
# se exigen los dos—, así que aquí se guarda el mayor y `R2` se lee como «hasta
# R2», no como «sólo R2».
marco:
  codigo: ENS-RD311-2022
  nombre: Esquema Nacional de Seguridad
  version: RD 311/2022
  fecha_vigencia: '2022-05-05'
  estado: vigente

fuente: 'BOE-A-2022-7191, Real Decreto 311/2022 de 3 de mayo, Anexo II'
revisado: false

requisitos:

