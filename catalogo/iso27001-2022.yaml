      - codigo: A.5.4
        tipo: control
        titulo: Responsabilidades de la dirección
        atributos: {tipo_control: [preventivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [identificar], capacidades_operativas: [gobernanza], dominios_seguridad: [gobernanza_y_ecosistema]}
      - codigo: A.5.5
        tipo: control
        titulo: Contacto con las autoridades
        atributos: {tipo_control: [preventivo, correctivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [identificar, proteger, responder, recuperar], capacidades_operativas: [gobernanza], dominios_seguridad: [defensa, resiliencia]}
      - codigo: A.5.6
