      - codigo: A.5.17
        tipo: control
        titulo: Información de autenticación
        atributos: {tipo_control: [preventivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [proteger], capacidades_operativas: [gestion_de_identidad_y_acceso], dominios_seguridad: [proteccion]}
      - codigo: A.5.18
        tipo: control
        titulo: Derechos de acceso
        atributos: {tipo_control: [preventivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [proteger], capacidades_operativas: [gestion_de_identidad_y_acceso], dominios_seguridad: [proteccion]}
      - codigo: A.5.19
