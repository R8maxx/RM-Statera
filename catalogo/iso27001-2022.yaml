# ISO/IEC 27001:2022 — catálogo normativo
#
# Fuente: ISO/IEC 27001:2022 (cláusulas 4 a 10 y Anexo A) e ISO/IEC 27002:2022
# (atributos de cada control). Incluye la enmienda 1:2024, que añade el cambio
# climático como cuestión a considerar en 4.1 y 4.2.
#
# El texto normativo de ISO/IEC 27001 y 27002 tiene derechos de autor: aquí van
# únicamente el código, el título corto y los atributos, que es lo que el sistema
# necesita para mapear, filtrar y generar la Declaración de Aplicabilidad. La
# redacción íntegra de cada control NO se vuelca a este repositorio.
#
# `revisado: false` mientras los títulos no se hayan contrastado con la norma.
marco:
  codigo: ISO27001-2022
  nombre: ISO/IEC 27001 — Sistemas de gestión de la seguridad de la información
  version: '2022'
  fecha_vigencia: '2022-10-25'
  estado: vigente

fuente: 'ISO/IEC 27001:2022 + Amd 1:2024; atributos según ISO/IEC 27002:2022'
revisado: false

requisitos:
  # ---------------------------------------------------------------------------
  # Cuerpo de la norma. Es lo que se audita como sistema de gestión, y lo que
  # más se descuida cuando alguien confunde "ISO 27001" con "los 93 controles".
  # ---------------------------------------------------------------------------
  - codigo: '4'
    tipo: clausula
    titulo: Contexto de la organización
    orden: 4
    hijos:
      - codigo: '4.1'
        tipo: clausula
        titulo: Comprensión de la organización y de su contexto
        descripcion: >-
          Cuestiones internas y externas pertinentes. La enmienda 1:2024 obliga a
          determinar si el cambio climático es una cuestión pertinente; el auditor
          lo pregunta.
      - codigo: '4.2'
        tipo: clausula
        titulo: Comprensión de las necesidades y expectativas de las partes interesadas
        descripcion: >-
          Incluye, desde la enmienda 1:2024, los requisitos de las partes
          interesadas relacionados con el cambio climático.
      - codigo: '4.3'
        tipo: clausula
        titulo: Determinación del alcance del sistema de gestión de la seguridad de la información
      - codigo: '4.4'
        tipo: clausula
        titulo: Sistema de gestión de la seguridad de la información

  - codigo: '5'
    tipo: clausula
    titulo: Liderazgo
    orden: 5
    hijos:
      - codigo: '5.1'
        tipo: clausula
        titulo: Liderazgo y compromiso
      - codigo: '5.2'
        tipo: clausula
        titulo: Política
      - codigo: '5.3'
        tipo: clausula
        titulo: Roles, responsabilidades y autoridades en la organización

  - codigo: '6'
    tipo: clausula
    titulo: Planificación
    orden: 6
    hijos:
      - codigo: '6.1'
        tipo: clausula
        titulo: Acciones para tratar riesgos y oportunidades
        hijos:
          - codigo: '6.1.1'
            tipo: clausula
            titulo: Generalidades
          - codigo: '6.1.2'
            tipo: clausula
            titulo: Apreciación de riesgos de seguridad de la información
            descripcion: >-
              Exige metodología formal con criterios de aceptación del riesgo.
              Es más estricta que el análisis informal que admite el ENS de
              categoría básica, así que el módulo de riesgos se dimensiona por
              esta cláusula.
          - codigo: '6.1.3'
            tipo: clausula
            titulo: Tratamiento de riesgos de seguridad de la información
            descripcion: >-
              De aquí sale la Declaración de Aplicabilidad, que en Statera es una
              consulta sobre la tabla de implantaciones, no un documento mantenido
              a mano.
      - codigo: '6.2'
        tipo: clausula
        titulo: Objetivos de seguridad de la información y planificación para su consecución
      - codigo: '6.3'
        tipo: clausula
        titulo: Planificación de cambios
        descripcion: Cláusula nueva en la revisión de 2022.

  - codigo: '7'
    tipo: clausula
    titulo: Soporte
    orden: 7
    hijos:
      - codigo: '7.1'
        tipo: clausula
        titulo: Recursos
      - codigo: '7.2'
        tipo: clausula
        titulo: Competencia
      - codigo: '7.3'
        tipo: clausula
        titulo: Concienciación
        descripcion: Sustenta el acuse de lectura de la documentación publicada.
      - codigo: '7.4'
        tipo: clausula
        titulo: Comunicación
      - codigo: '7.5'
        tipo: clausula
        titulo: Información documentada
        hijos:
          - codigo: '7.5.1'
            tipo: clausula
            titulo: Generalidades
          - codigo: '7.5.2'
            tipo: clausula
            titulo: Creación y actualización
          - codigo: '7.5.3'
            tipo: clausula
            titulo: Control de la información documentada

  - codigo: '8'
    tipo: clausula
    titulo: Operación
    orden: 8
    hijos:
      - codigo: '8.1'
        tipo: clausula
        titulo: Planificación y control operacional
      - codigo: '8.2'
        tipo: clausula
        titulo: Apreciación de riesgos de seguridad de la información
      - codigo: '8.3'
        tipo: clausula
        titulo: Tratamiento de riesgos de seguridad de la información

  - codigo: '9'
    tipo: clausula
    titulo: Evaluación del desempeño
    orden: 9
    hijos:
      - codigo: '9.1'
        tipo: clausula
        titulo: Seguimiento, medición, análisis y evaluación
      - codigo: '9.2'
        tipo: clausula
        titulo: Auditoría interna
        hijos:
          - codigo: '9.2.1'
            tipo: clausula
            titulo: Generalidades
          - codigo: '9.2.2'
            tipo: clausula
            titulo: Programa de auditoría interna
      - codigo: '9.3'
        tipo: clausula
        titulo: Revisión por la dirección
        hijos:
          - codigo: '9.3.1'
            tipo: clausula
            titulo: Generalidades
          - codigo: '9.3.2'
            tipo: clausula
            titulo: Entradas de la revisión por la dirección
            descripcion: >-
              Lista cerrada de entradas obligatorias. El generador de actas de
              Statera las recoge automáticamente.
          - codigo: '9.3.3'
            tipo: clausula
            titulo: Resultados de la revisión por la dirección

  - codigo: '10'
    tipo: clausula
    titulo: Mejora
    orden: 10
    hijos:
      - codigo: '10.1'
        tipo: clausula
        titulo: Mejora continua
      - codigo: '10.2'
        tipo: clausula
        titulo: No conformidad y acción correctiva
        descripcion: >-
          Incluye la verificación de la eficacia de la acción correctiva, que es
          lo que más se olvida y lo primero que el auditor comprueba.

  # ---------------------------------------------------------------------------
  # Anexo A. 93 controles en cuatro temas: organizativos (37), personas (8),
  # físicos (14) y tecnológicos (34).
  #
  # Los cinco atributos de cada control son los que define la ISO 27002:2022 y
  # se guardan en JSONB: sirven para filtrar y agrupar la vista del catálogo sin
  # necesidad de siete tablas de apoyo.
  # ---------------------------------------------------------------------------
  - codigo: A.5
    tipo: control
    titulo: Controles organizativos
    orden: 100
    hijos:
      - codigo: A.5.1
        tipo: control
        titulo: Políticas de seguridad de la información
        atributos: {tipo_control: [preventivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [identificar], capacidades_operativas: [gobernanza], dominios_seguridad: [gobernanza_y_ecosistema, resiliencia]}
      - codigo: A.5.2
        tipo: control
        titulo: Roles y responsabilidades en seguridad de la información
        atributos: {tipo_control: [preventivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [identificar], capacidades_operativas: [gobernanza], dominios_seguridad: [gobernanza_y_ecosistema, proteccion, resiliencia]}
      - codigo: A.5.3
