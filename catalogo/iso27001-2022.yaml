        atributos: {tipo_control: [preventivo, detectivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [identificar, proteger, detectar], capacidades_operativas: [seguridad_relaciones_proveedores, aseguramiento_de_la_seguridad], dominios_seguridad: [gobernanza_y_ecosistema, proteccion, defensa]}
      - codigo: A.5.23
