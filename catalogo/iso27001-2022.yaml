        atributos: {tipo_control: [preventivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [proteger], capacidades_operativas: [gestion_de_activos], dominios_seguridad: [proteccion]}
      - codigo: A.5.12
        tipo: control
        titulo: Clasificación de la información
