        atributos: {tipo_control: [preventivo], propiedades_seguridad: [C, I, D], conceptos_ciberseguridad: [proteger], capacidades_operativas: [proteccion_de_la_informacion], dominios_seguridad: [proteccion, defensa]}
      - codigo: A.5.14
