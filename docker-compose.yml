# Statera — entorno de desarrollo.
#
# Todo el producto corre en contenedores, incluida la aplicación PHP. El host
# sólo necesita Docker: ni PHP, ni Composer, ni Node, ni las diez extensiones
# que exige el lock. La imagen equivalente en producción se describe en la §10
# de stack-gestor-cumplimiento.md.
#
# Los contenedores de PHP y Node escriben en la carpeta del proyecto —vendor,
# node_modules, storage—, así que corren con tu UID y no como root. Si `id -u`
# no devuelve 1000, añade UID y GID al .env.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    container_name: statera-app
    environment:
      # Sólo este servicio hace el arranque largo —dependencias, APP_KEY,
      # migraciones y catálogo—. Dos `composer install` a la vez sobre la misma
      # carpeta se pisarían.
      STATERA_ARRANQUE: completo
      # Dónde están los servicios lo sabe el compose, no el .env: son la
      # topología de esta red, no una preferencia de nadie. Dotenv no pisa una
      # variable que ya está en el entorno, así que esto gana sobre el .env y un
      # fichero heredado de otra máquina no manda a la aplicación a 127.0.0.1,
      # que dentro de un contenedor es el propio contenedor.
      DB_HOST: postgres
      REDIS_HOST: redis
      GOTENBERG_URL: http://gotenberg:3000
      AWS_ENDPOINT: http://minio.localhost:9000
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # php-fpm sólo escucha cuando el entrypoint ha terminado: `exec` es su
      # última línea. Esperar a este puerto es esperar al arranque completo.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  nginx:
    image: nginx:1.27-alpine
    container_name: statera-nginx
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    container_name: statera-queue
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      GOTENBERG_URL: http://gotenberg:3000
      AWS_ENDPOINT: http://minio.localhost:9000
    # Horizon y no `queue:work`: las cuatro colas y sus tiempos ya están
    # declarados en config/horizon.php, y aquí sí existen pcntl y posix.
    command: ["php", "artisan", "horizon"]
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  vite:
    image: node:24-alpine
    container_name: statera-vite
    working_dir: /var/www/html
    # Escribe node_modules en la carpeta del proyecto: con el root del
    # contenedor dejaría ahí decenas de miles de ficheros que tu usuario no
    # puede borrar.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Un UID sin entrada en /etc/passwd no tiene HOME, y npm necesita uno
      # donde escribir su caché.
      HOME: /tmp
    entrypoint: ["/bin/sh", "/var/www/html/docker/node/entrypoint.sh"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/var/www/html

  postgres:
    image: postgres:17
    container_name: statera-postgres
    environment:
      POSTGRES_DB: statera
      POSTGRES_USER: statera
      POSTGRES_PASSWORD: statera
      # La base de tests se crea en el arranque inicial del volumen.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statera -d statera"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: statera-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8.9.1
    container_name: statera-gotenberg
    # Versión anclada, nunca el tag `8`: entre 8.8.0 y 8.9.1 la conversión a
    # PDF/A y PDF/UA estuvo rota.
    command:
      - "gotenberg"
      # La allow-list DENIEGA todo lo que no case. `data:` hace falta porque las
      # fuentes van incrustadas en el CSS: Chromium trata una fuente como
      # recurso sujeto a CORS y desde un `file://` la bloquearía en silencio.
      # Sigue sin entrar ningún http(s)://, que es de lo que protege — Gotenberg
      # descarga las URL que se le pasen.
      - "--chromium-allow-list=^(file:///tmp/|data:).*"
      # Primer eslabón de la cadena: 120 s < Guzzle 180 s < timeout del job 300 s.
      - "--api-timeout=120s"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # quay.io y NO Docker Hub: MinIO retiró de allí `minio/minio` y `minio/mc`,
    # y un repositorio que no existe se anuncia como «pull access denied», que
    # parece un problema de credenciales y no lo es.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: statera-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: statera
      MINIO_ROOT_PASSWORD: statera-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      default:
        aliases:
          # El alias es lo que hace descargable una evidencia. `temporaryUrl()`
          # firma con SigV4 y el nombre del host va DENTRO de la firma, así que
          # el navegador tiene que llegar por el mismo nombre que usó el
          # servidor; reescribirlo después invalida la firma. Dentro de la red
          # este nombre resuelve al contenedor, y en el navegador cualquier
          # *.localhost resuelve a loopback, donde está publicado el 9000.
          - minio.localhost
    # Sin healthcheck a propósito: el recomendado es `mc ready local`, y que
    # `mc` siga dentro de la imagen es un detalle de MinIO que ya ha cambiado
    # una vez. Quien espera es `minio-init`, en su propio bucle.

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: statera-minio-init
    environment:
      MINIO_ROOT_USER: statera
      MINIO_ROOT_PASSWORD: statera-secret
      AWS_BUCKET: statera-evidencias
      AWS_BUCKET_DOCUMENTOS: statera-documentos
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    depends_on:
      - minio

volumes:
  postgres-data:
  redis-data:
  minio-data:
